name: Scheduled Paper Trading

# STATUS: HELD — schedule is commented out until launch is approved.
# To activate: remove the '# HELD:' prefixes from the schedule block below.
#
# Cron explanation (GitHub Actions uses UTC):
#   NSE market hours: 09:15 – 15:30 IST  =  03:45 – 10:00 UTC
#   Every 5 minutes:  */5 3-10 * * 1-5
#   NOTE: The cron bracket 3-10 means hours 03–10 UTC.
#         First fire at 03:45 UTC (09:15 IST), last possible fire at 10:00 UTC (15:30 IST).
#         The worker enforces IST boundaries internally and exits cleanly if the session is closed.

on:
  schedule:
    # 09:15–15:30 IST, Monday–Friday (converted to UTC):
    # 1. 09:15–09:55 IST = 03:45–03:55 UTC (every 5 min)
    - cron: '45-59/5 3 * * 1-5'
    # 2. 09:30–15:25 IST = 04:00–09:55 UTC (every 5 min)
    - cron: '*/5 4-9 * * 1-5'
    # 3. 15:30 IST = 10:00 UTC (final market close evaluation)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force_session:
        description: 'Bypass market hours check for testing'
        required: false
        default: false
        type: boolean

concurrency:
  group: paper-trading-worker
  # false: never cancel an active trading cycle. A new trigger queues behind the running one.
  cancel-in-progress: false

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install smartapi-python pyotp logzero websocket-client yfinance requests

      - name: Run Intraday Worker Cycle
        env:
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_CLIENT_ID: ${{ secrets.ANGELONE_CLIENT_ID }}
          ANGELONE_PASSWORD: ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_USER_ID: '00000000-0000-0000-0000-000000000002'
          TRADING_MODE: 'paper'
          LIVE_TRADING_ENABLED: 'false'
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.force_session }}" = "true" ]; then
            EXTRA_FLAGS="--force-session"
          fi
          python -m backend.app.worker --run-once $EXTRA_FLAGS

      # Emergency square-off safety cycle.
      # Purpose: if the main cycle runs after 15:15 IST, open positions are square-off
      #          by the worker's own IST time check. This step runs unconditionally
      #          whenever the UTC time is >= 09:45 (= 15:15 IST) — no upper bound, so
      #          a cron delayed past 16:00 IST still triggers square-off.
      # Safety: the worker's close_position() is idempotent — already-closed positions
      #         are skipped. Realistic slippage and fees are applied even on forced exits.
      - name: Emergency Square-Off Safety Cycle (>= 15:15 IST)
        env:
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_CLIENT_ID: ${{ secrets.ANGELONE_CLIENT_ID }}
          ANGELONE_PASSWORD: ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_USER_ID: '00000000-0000-0000-0000-000000000002'
          TRADING_MODE: 'paper'
          LIVE_TRADING_ENABLED: 'false'
        run: |
          # Run only if UTC >= 09:45 (= 15:15 IST). No upper bound: a late cron still
          # forces square-off. New entries are blocked by the worker's session check.
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          TOTAL_MINS=$((HOUR * 60 + MIN))
          SQUAREOFF_MINS=$((9 * 60 + 45))   # 09:45 UTC = 15:15 IST
          if [ "$TOTAL_MINS" -ge "$SQUAREOFF_MINS" ]; then
            echo "Post-15:15 IST (UTC ${HOUR}:${MIN}) — running emergency square-off cycle"
            python -m backend.app.worker --run-once --force-session
          else
            echo "Pre-square-off window (UTC ${HOUR}:${MIN}). Emergency cycle skipped."
          fi
